<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tienda de Mascotas</title>
  <link rel="stylesheet" href="./css/style.css">
</head>

<body>
  <!-- Navbar -->
  <nav>
    <div class="logo">🐶 PetShop</div>
    <ul>
      <li><a href="#home">Inicio</a></li>
      <li><a href="#products">Productos</a></li>
      <li><a href="#comments">Comentarios</a></li>
      <li><a href="#donations">Donaciones</a></li>
    </ul>
  </nav>

  <!-- Sección Home -->
  <section id="home" class="hero">
    <h1>Bienvenido a PetShop</h1>
    <p>Todo para tu mascota 🐾</p>
  </section>
  <!-- Sección Donaciones -->
  <section id="donations" class="section">
    <div class="comment-container">
      <div class="comment-header">
        <img src="https://cdn-icons-png.flaticon.com/512/3462/3462022.png" alt="Icono comentarios" class="comment-icon">
        <h2>¡Gracias por tus Donaciones!</h2>
        <p>Nos ayuda a seguir ayudando a los mas pequeños🐾</p>
      </div>
      <form id="donationForm" class="comment-form">
        <div class="form-group">
          <input type="number" id="amount" placeholder="Monto (USD)" min="1" step="0.01" required>
        </div>
        <div class="form-group">
          <input type="text" id="fullname" placeholder="Nombre completo" required>
        </div>
        <div class="form-group">
          <input type="text" id="cardNumber" placeholder="Número de tarjeta" required>
        </div>
        <div class="form-group">
          <input type="text" id="cvv" placeholder="CVV" required>
        </div>
        <div class="form-group">
          <input type="number" id="expMonth" placeholder="Mes (MM)" min="1" max="12" required>
        </div>
        <div class="form-group">
          <input type="number" id="expYear" placeholder="Año (YYYY)" min="2023" required>
        </div>
        <div class="form-group">
          <select id="currency" required>
            <option value="USD">USD</option>
            <option value="EUR">EUR</option>
            <option value="MXN">MXN</option>
          </select>
        </div>
        <div class="form-group">
          <textarea id="donationMessage" placeholder="Mensaje (opcional)"></textarea>
        </div>
        <div class="g-recaptcha" data-sitekey="6Les91ArAAAAAAHOCoFMP3pX48-RBoNFAzwhNPuj"></div>
        <div class="form-group">
          <div id="paymentResponse" />
        </div>
        <button type="submit">Donar</button>
      </form>
      <div id="donationStatus"></div>
    </div>
  </section>

  <footer>
    <p>© 2023 PetShop. Todos los derechos reservados.</p>
  </footer>
  <script src="https://www.google.com/recaptcha/api.js" async defer></script>
  <script src="./js/script.js"></script>
  <script src="./js/validation.js"></script>
</body>

</html>
