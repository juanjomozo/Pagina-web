<!DOCTYPE html>
<html lang="es">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Register - PetShop</title>
	<link rel="stylesheet" href="./css/style.css">
	<link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
</head>

<body>
	<section id="comments" class="section">
	</section>
	<div class="login-container">
		<div class="login-card">
			<img src="https://cdn-icons-png.flaticon.com/512/616/616408.png" alt="Logo PetShop" class="login-logo">
			<h1>Registro Usuarios</h1>
			<p>Registrate en nuestro sitio WEB</p>
			<div class="container">
				<form id="RegisterForm" class="comment-form">
					<div class="form-group">
						<input type="text" id="name" placeholder="Nombre" required>
					</div>
					<div class="form-group">
						<input type="text" id="last" placeholder="Apellido" required>
					</div>
					<div class="form-group">
						<input type="email" id="email" placeholder="Email" required>
					</div>
					<div class="form-group">
						<input type="password" id="password" name="Password" autocomplete="current-password" placeholder="Password"
							required>
					</div>
					<button type="submit">Enviar</button>
				</form>
				<div class="form-group">
					<div id="commentsList"></div>
				</div>
			</div>
			<div class="login-footer">
				<a href="./index.html">← Volver al inicio</a>
			</div>
		</div>
	</div>
	<script src="https://ajax.googleapis.com/ajax/libs/jquery/1.8.2/jquery.min.js"></script>
	<script src="https://www.google.com/recaptcha/api.js" async defer></script>
	<script type="module" src="./js/validation.js" />
	<script type="module" src="./js/register.js" />
</body>

</html>
