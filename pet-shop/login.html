<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="google-signin-client_id"
    content="548665091423-v8c3onptf16v2vj0inh8mbqckocnn0g2.apps.googleusercontent.com">
  <title>Login - PetShop</title>
  <link rel="stylesheet" href="./css/style.css">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
</head>

<body>
  <div class="login-container">
    <div class="login-card">
      <img src="https://cdn-icons-png.flaticon.com/512/616/616408.png" alt="Logo PetShop" class="login-logo">
      <h1>Iniciar Sesión</h1>
      <p>Accede para administrar comentarios y donaciones</p>
      <div class="container">
        
        <form id="commentForm" class="comment-form">
          <div class="form-group">
            <input type="email" id="name" placeholder="email" required>
          </div>
          <div class="form-group">
            <input type="password" id="email" placeholder="Password" required>
          </div>
          
          <div class="g-recaptcha" data-sitekey="6Les91ArAAAAAAHOCoFMP3pX48-RBoNFAzwhNPuj"></div>
          <button type="submit">Enviar</button>
        </form>
        <div class="form-group">
          <div id="commentsList"></div>
        </div>
      </div>
      <div class="RegLeft">
        <div class="forgetPass"><span><a href="./register.html"> Registrar </a></span></div>
        <div class="forgetPass"><span>Olvido Password</span></div>
      </div>
      <div id="googleLoginBtn" className="custom-google-btn" />
      <div class="login-footer">
        <a href="./index.html">← Volver al inicio</a>
      </div>
    </div>
  </div>
  <script>
    // Espera a que el SDK esté listo
    window.onload = function () {
      google.accounts.id.initialize({
        client_id: '548665091423-v8c3onptf16v2vj0inh8mbqckocnn0g2.apps.googleusercontent.com',
        callback: (response) => {
          const user = JSON.parse(atob(response.credential.split('.')[1]));
          console.log('Usuario:', user);
          localStorage.setItem('user', JSON.stringify(user));
          window.location.href = 'admin.html';
        }
      });

      // Renderiza el botón
      google.accounts.id.renderButton(
        document.getElementById('googleLoginBtn'),
        { theme: 'filled_blue', size: 'large' }
      );
    };
    </script>
  <!-- SDK de Google -->
  <script src="https://ajax.googleapis.com/ajax/libs/jquery/1.8.2/jquery.min.js"></script>
  <script src="https://www.google.com/recaptcha/api.js" async defer></script>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script type="module" src="./js/auth.js" />
</body>

</html>
